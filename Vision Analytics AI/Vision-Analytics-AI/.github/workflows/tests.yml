name: Tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install numpy scipy PyYAML pydantic fastapi httpx pillow opencv-python-headless pytest ruff
      - run: ruff check app scripts tests configs
      - run: python -m pytest -q
