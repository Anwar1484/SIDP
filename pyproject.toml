[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sidp-vision-analytics"
version = "0.2.0"
description = "YOLO26 posture and experimental temporal fall observations for SIDP Subsystem 2"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
sidp-vision = "app.main:main"
sidp-monitor = "app.monitor:main"

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}

[tool.setuptools.packages.find]
include = ["app*", "configs*"]

[tool.setuptools.package-data]
configs = ["*.yaml", "*.json"]
"app.web" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
